<style>
.flt-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; margin: 12px 0; }
.flt-label { font-weight: 600; color: var(--maroon); font-size: 15px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 5px 12px; font-size: 14px; cursor: pointer; }
.chip.sel { background: var(--maroon); color: #fff; border-color: var(--maroon); }
.sortsel { border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 14px; background: #fff; }
.pager { display: flex; gap: 12px; justify-content: center; align-items: center; margin: 22px 0; }
.pager button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 18px; cursor: pointer; font-size: 14px; }
.pager button:disabled { opacity: 0.4; cursor: default; }
.mixer { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 28px; margin-top: 48px; }
.mixer h3 { text-align: center; color: var(--maroon); margin: 0 0 6px; font-size: 26px; }
.mixer .sub { text-align: center; color: var(--muted); margin: 0 0 18px; }
.mix-form { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: end; }
.mix-field { display: flex; flex-direction: column; gap: 4px; }
.mix-field label { font-size: 13px; color: var(--muted); }
.mix-field input { border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font-size: 15px; min-width: 160px; }
.mix-go { background: var(--maroon); color: #fff; border: none; border-radius: 10px; padding: 10px 22px; font-size: 15px; cursor: pointer; }
.mix-sec-t { color: var(--maroon); font-size: 19px; margin: 24px 0 4px; }
.mix-note { background: #fff8e6; border: 1px solid #f0d98c; border-radius: 10px; padding: 10px 14px; font-size: 14px; margin: 12px 0; }
.tag.compound { background: #f3e8d0; color: #7a5b1e; }

<script>
var curG = "all", curL = "all", curS = "all", curSort = "az", curPage = 0;
var mixG = "all";
var PAGE = 48;

function T(k, v) { return window.I18N.t(k, v); }
function gLabel(g) { return T(g === "boy" ? "pill_boy" : g === "girl" ? "pill_girl" : "pill_both"); }

function setG(btn) {
  curG = btn.getAttribute("data-g");
  var pills = btn.parentElement.querySelectorAll(".pill");
  pills.forEach(function (p) { p.classList.remove("sel"); });
  btn.classList.add("sel");
  onFilter();
}
function setLetter(btn) {
  curL = btn.getAttribute("data-l");
  document.querySelectorAll("#letters .chip").forEach(function (p) { p.classList.remove("sel"); });
  btn.classList.add("sel");
  onFilter();
}
function setSyl(btn) {
  curS = btn.getAttribute("data-s");
  document.querySelectorAll("#syls .chip").forEach(function (p) { p.classList.remove("sel"); });
  btn.classList.add("sel");
  onFilter();
}
function setMixG(btn) {
  mixG = btn.getAttribute("data-g");
  document.querySelectorAll("#mixG .chip").forEach(function (p) { p.classList.remove("sel"); });
  btn.classList.add("sel");
}

function buildChips() {
  var initials = {};
  window.NAMES.forEach(function (x) { initials[x.n.charAt(0).toUpperCase()] = 1; });
  var lh = '<button class="chip' + (curL === "all" ? " sel" : "") + '" data-l="all" onclick="setLetter(this)">' + T("flt_all") + "</button>";
  Object.keys(initials).sort().forEach(function (c) {
    lh += '<button class="chip' + (curL === c ? " sel" : "") + '" data-l="' + c + '" onclick="setLetter(this)">' + c + "</button>";
  });
  document.getElementById("letters").innerHTML = lh;
  var sh = '<button class="chip' + (curS === "all" ? " sel" : "") + '" data-s="all" onclick="setSyl(this)">' + T("flt_all") + "</button>";
  ["1", "2", "3", "4", "5+"].forEach(function (s) {
    sh += '<button class="chip' + (curS === s ? " sel" : "") + '" data-s="' + s + '" onclick="setSyl(this)">' + s + "</button>";
  });
  document.getElementById("syls").innerHTML = sh;
}

function filtered() {
  var raw = document.getElementById("q").value.trim();
  var q = raw.toLowerCase();
  var list = window.NAMES.filter(function (x) {
    if (nakActive && !nakMatch(x)) return false;
    if (curG !== "all" && x.g !== curG && x.g !== "both") return false;
    if (curL !== "all" && x.n.charAt(0).toUpperCase() !== curL) return false;
    if (curS !== "all") {
      if (curS === "5+") { if (x.s < 5) return false; }
      else if (x.s !== parseInt(curS, 10)) return false;
    }
    if (q && x.n.toLowerCase().indexOf(q) < 0 && x.d.indexOf(raw) < 0 &&
        x.m.hi.indexOf(raw) < 0 && x.m.en.toLowerCase().indexOf(q) < 0 && x.m.ne.indexOf(raw) < 0) return false;
    return true;
  });
  curSort = document.getElementById("sort").value;
  if (curSort === "az") list.sort(function (a, b) { return a.n < b.n ? -1 : 1; });
  else if (curSort === "sylAsc") list.sort(function (a, b) { return a.s - b.s || (a.n < b.n ? -1 : 1); });
  else list.sort(function (a, b) { return b.s - a.s || (a.n < b.n ? -1 : 1); });
  return list;
}

function card(x) {
  var L = window.I18N.lang;
  var tags = '<span class="tag">' + gLabel(x.g) + "</span>";
  if (x.t) tags += '<span class="tag">' + x.t + "</span>";
  if (x.src === "compound") tags += '<span class="tag compound">' + T("tag_compound") + "</span>";
  return '<div class="name-card"><div class="nm">' + x.d + '</div><div class="lt">' + x.n +
    '</div><div class="mn">' + x.m[L] + '</div><div class="tags">' + tags + "</div></div>";
}

function onFilter() { curPage = 0; nakActive = false; render(); }

function render() {
  var list = filtered();
  var pages = Math.max(1, Math.ceil(list.length / PAGE));
  if (curPage >= pages) curPage = pages - 1;
  var slice = list.slice(curPage * PAGE, curPage * PAGE + PAGE);
  document.getElementById("grid").innerHTML = slice.map(card).join("") ||
    '<p class="soon">' + T("no_res") + "</p>";
  document.getElementById("count").textContent = T("names_count", { n: list.length });
  var pg = document.getElementById("pager");
  if (pages > 1) {
    pg.innerHTML = '<button onclick="goPage(-1)" ' + (curPage === 0 ? "disabled" : "") + ">" + T("page_prev") + "</button>" +
      '<span>' + T("page_of", { p: curPage + 1, t: pages }) + "</span>" +
      '<button onclick="goPage(1)" ' + (curPage === pages - 1 ? "disabled" : "") + ">" + T("page_next") + "</button>";
  } else { pg.innerHTML = ""; }
}
function goPage(d) { curPage += d; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }

/* ---------- parent-name mixer ---------- */
function nameChunks(s) {
  s = s.toLowerCase().replace(/[^a-z]/g, "");
  var m = s.match(/[^aeiou]*[aeiou]+[^aeiou]?/g);
  return (m && m.join("").length >= Math.max(2, s.length - 1)) ? m : [s];
}
function genBlends(f, m) {
  var A = nameChunks(f), B = nameChunks(m), seen = {}, res = [];
  function add(s) {
    if (s.length < 3 || s.length > 12) return;
    s = s.charAt(0).toUpperCase() + s.slice(1);
    if (!seen[s]) { seen[s] = 1; res.push(s); }
  }
  var i, j;
  for (i = 1; i <= A.length; i++) for (j = 1; j <= B.length; j++) {
    add(A.slice(0, i).join("") + B.slice(-j).join(""));
    add(B.slice(0, j).join("") + A.slice(-i).join(""));
  }
  var fl = f.toLowerCase().replace(/[^a-z]/g, ""), ml = m.toLowerCase().replace(/[^a-z]/g, "");
  add(fl.slice(0, Math.ceil(fl.length / 2)) + ml.slice(Math.floor(ml.length / 2)));
  add(ml.slice(0, Math.ceil(ml.length / 2)) + fl.slice(Math.floor(fl.length / 2)));
  return res;
}
function lev(a, b) {
  var d = [], i, j;
  for (i = 0; i <= a.length; i++) d[i] = [i];
  for (j = 0; j <= b.length; j++) d[0][j] = j;
  for (i = 1; i <= a.length; i++) for (j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}
function doMix() {
  var f = document.getElementById("mixF").value.trim();
  var m = document.getElementById("mixM").value.trim();
  var init = document.getElementById("mixInit").value.trim().toUpperCase();
  var out = document.getElementById("mixOut");
  if (!f || !m) { out.innerHTML = '<p class="soon">' + T("mix_none") + "</p>"; return; }
  var blends = genBlends(f, m);
  var dbNames = {};
  window.NAMES.forEach(function (x) { dbNames[x.n.toLowerCase()] = x; });
  function okG(x) { return mixG === "all" || x.g === mixG || x.g === "both"; }
  function okI(nm) { return !init || nm.charAt(0).toUpperCase() === init; }
  var exact = [], scored = [];
  blends.forEach(function (b) {
    var bl = b.toLowerCase();
    if (dbNames[bl] && okG(dbNames[bl]) && okI(b)) { exact.push(dbNames[bl]); return; }
    var best = null, bestD = 99;
    window.NAMES.forEach(function (x) {
      if (!okG(x) || !okI(x.n)) return;
      var d = lev(bl, x.n.toLowerCase());
      if (d < bestD) { bestD = d; best = x; }
    });
    if (best && bestD <= 3) scored.push({ x: best, d: bestD, b: b });
  });
  scored.sort(function (a, b) { return a.d - b.d; });
  var seenR = {}, real = [];
  exact.concat(scored.map(function (s) { return s.x; })).forEach(function (x) {
    if (!seenR[x.n]) { seenR[x.n] = 1; real.push(x); }
  });
  real = real.slice(0, 8);
  var creative = blends.filter(function (b) { return !dbNames[b.toLowerCase()] && okI(b); }).slice(0, 8);
  var html = "";
  if (real.length) {
    html += '<div class="mix-sec-t">' + T("mix_match") + "</div>" +
      '<div class="name-grid">' + real.map(card).join("") + "</div>";
  }
  if (creative.length) {
    html += '<div class="mix-sec-t">' + T("mix_creative") + "</div>" +
      '<div class="mix-note">' + T("mix_review") + "</div>" +
      '<div class="name-grid">' + creative.map(function (b) {
        return '<div class="name-card"><div class="nm">' + b + '</div><div class="lt">' + T("mix_creative") + "</div></div>";
      }).join("") + "</div>";
  }
  out.innerHTML = html || '<p class="soon">' + T("no_res") + "</p>";
}

var RASHI = [
 {hi:"मेष",en:"Mesha",ne:"मेष"},{hi:"वृषभ",en:"Vrishabha",ne:"वृषभ"},
 {hi:"मिथुन",en:"Mithuna",ne:"मिथुन"},{hi:"कर्क",en:"Karka",ne:"कर्कट"},
 {hi:"सिंह",en:"Simha",ne:"सिंह"},{hi:"कन्या",en:"Kanya",ne:"कन्या"},
 {hi:"तुला",en:"Tula",ne:"तुला"},{hi:"वृश्चिक",en:"Vrishchika",ne:"वृश्चिक"},
 {hi:"धनु",en:"Dhanu",ne:"धनु"},{hi:"मकर",en:"Makara",ne:"मकर"},
 {hi:"कुंभ",en:"Kumbha",ne:"कुम्भ"},{hi:"मीन",en:"Meena",ne:"मीन"}
];
function d2r(d){return d*Math.PI/180;}
function rev360(x){x%=360;return x<0?x+360:x;}
function sind(d){return Math.sin(d2r(d));}
function cosd(d){return Math.cos(d2r(d));}
/* Moon's sidereal longitude (Lahiri), Schlyter's algorithm. y,mo,d calendar; uth = UT hours (may exceed 24 / be negative). */
function moonSidereal(y, mo, d, uth) {
  var Y=y, M=mo;
  if (M<=2){Y-=1;M+=12;}
  var A=Math.floor(Y/100), B=2-A+Math.floor(A/4);
  var jd0=Math.floor(365.25*(Y+4716))+Math.floor(30.6001*(M+1))+d+B-1524.5;
  /* Schlyter's day count starts at 2000 Jan 0.0 (= 1999 Dec 31 0h UT), i.e. JD 2451543.5 */
  var dd=jd0-2451543.5+uth/24;
  var N=rev360(125.1228-0.0529538083*dd), inc=5.1454;
  var w=rev360(318.0634+0.1643573223*dd), a=60.2666, e=0.054900;
  var Mm=rev360(115.3654+13.0649929509*dd);
  var E=Mm+(180/Math.PI)*e*sind(Mm)*(1+e*cosd(Mm)), E1, k;
  for(k=0;k<4;k++){E1=E-(E-(180/Math.PI)*e*sind(E)-Mm)/(1-e*cosd(E));E=E1;}
  var xv=a*(cosd(E)-e), yv=a*Math.sqrt(1-e*e)*sind(E);
  var v=r2d(Math.atan2(yv,xv)), r=Math.sqrt(xv*xv+yv*yv);
  var xh=r*(cosd(N)*cosd(v+w)-sind(N)*sind(v+w)*cosd(inc));
  var yh=r*(sind(N)*cosd(v+w)+cosd(N)*sind(v+w)*cosd(inc));
  var zh=r*(sind(v+w)*sind(inc));
  var lon=rev360(r2d(Math.atan2(yh,xh)));
  var Ms=rev360(356.0470+0.9856002585*dd);
  var Ls=rev360(Ms+282.9404+4.70935E-5*dd);
  var Lm=rev360(N+w+Mm), Dm=rev360(Lm-Ls), F=rev360(Lm-N);
  lon+= -1.274*sind(Mm-2*Dm)+0.658*sind(2*Dm)-0.186*sind(Ms)-0.059*sind(2*Mm-2*Dm)-0.057*sind(Mm-2*Dm+Ms);
  lon=rev360(lon);
  var ayan=23.853+(dd-1.5)*(50.2795/3600/365.25);
  return rev360(lon-ayan);
}
function r2d(r){return r*180/Math.PI;}
var nakSyls=null, nakActive=false;
function doNak(){
  var dv=document.getElementById("nakD").value, tv=document.getElementById("nakT").value||"12:00";
  var tz=parseInt(document.getElementById("nakTZ").value,10);
  var out=document.getElementById("nakOut");
  if(!dv){out.innerHTML='<p class="soon">'+T("nak_need")+"</p>";return;}
  var p=dv.split("-"), q=tv.split(":");
  var uth=parseInt(q[0],10)+parseInt(q[1],10)/60-tz/60;
  var slon=moonSidereal(parseInt(p[0],10),parseInt(p[1],10),parseInt(p[2],10),uth);
  var span=360/27, ni=Math.floor(slon/span)%27;
  var pada=Math.floor((slon-ni*span)/(span/4))+1;
  var ri=Math.floor(slon/30)%12;
  var L=window.I18N.lang, nk=NAKSH[ni];
  nakSyls=nk.s;
  var chips=nk.s.map(function(s,i){
    return '<span class="chip'+(i===pada-1?" sel":"")+'" style="cursor:default">'+s[0]+" · "+s[1]+"</span>";
  }).join("");
  out.innerHTML=
    '<div class="mix-note" style="margin-top:18px"><b>'+T("nak_lb_nak")+":</b> "+nk.n[L]+" ("+nk.n.en+") &nbsp;·&nbsp; <b>"+T("nak_lb_pada")+":</b> "+pada+" &nbsp;·&nbsp; <b>"+T("nak_lb_rashi")+":</b> "+RASHI[ri][L]+"</div>"+
    '<div class="mix-sec-t">'+T("nak_lb_syl")+'</div>'+
    '<div class="chips" style="justify-content:flex-start;margin-bottom:6px">'+chips+"</div>"+
    '<div class="mix-note">'+T("nak_yours")+": <b>"+nk.s[pada-1][0]+" · "+nk.s[pada-1][1]+"</b></div>"+
    '<button class="mix-go" onclick="nakShowNames()">'+T("nak_show")+"</button> "+
    '<button class="mix-go" style="background:#fff;color:var(--maroon);border:1px solid var(--line);margin-left:8px" onclick="nakClear()">'+T("nak_clear")+"</button> "+
    '<div class="mix-note" style="margin-top:12px">'+T("nak_approx")+"</div>";
}
function nakShowNames(){
  nakActive=true; curG="all"; curL="all"; curS="all"; curPage=0;
  document.getElementById("q").value="";
  document.querySelectorAll(".filters .pill").forEach(function(p){p.classList.toggle("sel",p.getAttribute("data-g")==="all");});
  buildChips(); render();
  document.getElementById("grid").scrollIntoView({behavior:"smooth"});
}
function nakClear(){nakActive=false;render();}
function nakMatch(x){
  if(!nakSyls) return false;
  var nl=x.n.toLowerCase();
  for(var i=0;i<nakSyls.length;i++){
    if(nl.indexOf(nakSyls[i][0])===0||x.d.indexOf(nakSyls[i][1])===0) return true;
  }
  return false;
}
