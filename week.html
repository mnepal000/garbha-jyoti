<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>सप्ताह-दर-सप्ताह यात्रा | गर्भ ज्योति</title>
<meta name="description" content="गर्भावस्था के हर सप्ताह: शिशु का विकास, एक मंत्र, एक अभ्यास और एक सुझाव।">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="assets/img/logo.png">
</head>
<body>
<script src="assets/site.js"></script>
<script src="assets/weeks.js"></script>

<section class="block" style="padding-top: 44px;">
  <div class="wrap">
    <h2 style="font-size: 40px;">सप्ताह-दर-सप्ताह यात्रा</h2>
    <p class="sub">हर सप्ताह: शिशु का विकास, एक अभ्यास और एक सुझाव</p>

    <div class="tracker">
      <h2>आप किस सप्ताह में हैं?</h2>
      <p>अपनी ड्यू डेट (प्रसव की संभावित तिथि) डालें — हम आपका सप्ताह बता देंगे</p>
      <input type="date" id="duedate">
      <button class="btn btn-gold" onclick="calcWeek()">मेरा सप्ताह देखें</button>
      <p id="tracker-msg" style="margin-top: 14px; margin-bottom: 0; min-height: 28px;"></p>
    </div>

    <div class="weeknav" id="weeknav"></div>
    <div id="weekdetail"></div>
  </div>
</section>

<script>
var MAXW = 40;
function hasData(w) { return window.WEEKS.some(function (x) { return x.w === w; }); }
function renderNav(sel) {
  var el = document.getElementById("weeknav");
  var html = "";
  for (var w = 1; w <= MAXW; w++) {
    var cls = hasData(w) ? "ready" : "";
    if (w === sel) cls += " sel";
    html += '<button class="' + cls + '" onclick="selectWeek(' + w + ')">' + w + "</button>";
  }
  el.innerHTML = html;
}
function selectWeek(w) {
  renderNav(w);
  var d = document.getElementById("weekdetail");
  var found = null;
  window.WEEKS.forEach(function (x) { if (x.w === w) found = x; });
  if (found) {
    d.innerHTML =
      '<div class="week-detail"><div class="wk">' + w + "वां सप्ताह</div><h2>" + found.size + "</h2>" +
      '<div class="fact"><div class="ic">🌱</div><div><h4>शिशु का विकास</h4><p>' + found.growth + "</p></div></div>" +
      '<div class="fact"><div class="ic">🪔</div><div><h4>इस सप्ताह का अभ्यास</h4><p>' + found.sadhana + "</p></div></div>" +
      '<div class="fact"><div class="ic">💡</div><div><h4>सुझाव</h4><p>' + found.tip + "</p></div></div></div>";
  } else {
    d.innerHTML =
      '<div class="week-detail"><div class="soon"><div style="font-size:44px; margin-bottom:10px;">🪔</div>' +
      "<h2>" + w + "वां सप्ताह — जल्द आ रहा है</h2>" +
      "<p>हम हर सप्ताह नई सामग्री जोड़ रहे हैं। नए वीडियो सबसे पहले पाने के लिए<br>" +
      '<a class="btn btn-gold" style="margin-top:16px;" href="https://www.youtube.com/@garbhajyoti" target="_blank" rel="noopener">YouTube पर जुड़ें</a></p></div></div>';
  }
  d.scrollIntoView({ behavior: "smooth", block: "start" });
}
function calcWeek() {
  var v = document.getElementById("duedate").value;
  var msg = document.getElementById("tracker-msg");
  if (!v) { msg.textContent = "कृपया तिथि चुनें"; return; }
  var due = new Date(v + "T00:00:00");
  var lmp = new Date(due.getTime() - 280 * 86400000);
  var now = new Date(); now.setHours(0, 0, 0, 0);
  var w = Math.floor((now - lmp) / 604800000) + 1;
  if (w < 1) { msg.textContent = "बधाई! आपकी यात्रा अभी शुरू होने वाली है — पहला सप्ताह देखें।"; selectWeek(1); }
  else if (w > 40) { msg.textContent = "आपकी ड्यू डेट निकल चुकी है — शिशु के जन्म की बधाई!"; }
  else { msg.textContent = "बधाई! आप अभी " + w + "वें सप्ताह में हैं।"; selectWeek(w); }
}
(function init() {
  var m = location.search.match(/[?&]w=(\d+)/);
  var start = m ? Math.min(40, Math.max(1, parseInt(m[1], 10))) : 12;
  selectWeek(start);
  window.scrollTo(0, 0);
})();
</script>
</body>
</html>
